- type: antag
  id: SpaceNinja
  name: roles-antag-space-ninja-name
  antagonist: true
  setPreference: false
  objective: roles-antag-space-ninja-objective
  guides: [ SpaceNinja ]
  requirements:
  - !type:SpeciesRequirement
    inverted: true
    species:
    - Plasmaman
  creditImage: /Textures/_Trauma/EndCredits/Antags/ninja.png # Trauma

- type: antagSpecifier
  parent: RestrictedAntag
  id: SpaceNinja
  spawnerPrototype: SpawnPointGhostSpaceNinja
  pickPlayer: false
  startingGear: SpaceNinjaGear
  roleLoadout:
  - RoleSurvivalSpaceNinja
  briefing:
    sound: /Audio/Misc/ninja_greeting.ogg
    # SIS-ChatGreeting-Start
    theme:
      titleBackground: "#0d1410"
      titleBorder: "#00ff66"
      messageBackground: "#060a08"
      messageBorder: "#193826"
      titleText: "#55efc4"
      messageText: "#c8d6cb"
      highlight1: "#00ff66"
      highlight2: "#00d2d3"
    # SIS-ChatGreeting-End
  components:
  - type: SpaceNinja
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: AutoImplant
    implants:
    - MicroBombImplant # Trauma - was DeathAcidifierImplant, bada bing
  - type: RandomMetadata
    nameSegments:
    - NamesNinjaTitle
    - NamesNinja
    nameFormat: name-format-ninja
  mindRoles:
  - MindRoleNinja

#Ninja Gear
- type: startingGear
  id: SpaceNinjaGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitNinja
    back: ClothingBackpackSatchelNinja
    mask: ClothingMaskNinja
    head: ClothingHeadHelmetSpaceNinja
    eyes: ClothingEyesVisorNinja
    gloves: ClothingHandsGlovesSpaceNinja
    outerClothing: ClothingOuterSuitSpaceNinja
    shoes: ClothingShoesSpaceNinja
    id: NinjaPDA
    ears: ClothingHeadsetNinja
    pocket1: SpiderCharge
    pocket2: PinpointerStation
    belt: ClothingBeltSheathKatanaNinjaFilled # Trauma - was EnergyKatana
  inhand:
    - JetpackBlackFilled
    - NinjutsuScroll # Goobstation
  storage:
    back: # belt holds katana so satchel has the tools for sabotaging things
    - Crowbar
    - Wrench
    - Screwdriver
    - Wirecutter
    - Welder
    - Multitool
    - EmergencyMedipen
    - Flare
    #- FoodSnackNutribrick # Trauma - rob chef instead chud
    - DrinkWaterBottleFull

- type: chameleonOutfit
  id: NinjaChameleonOutfit
  name: roles-antag-space-ninja-name
  icon: "JobIconNinja"
  startingGear: SpaceNinjaGear
  equipment:
    neck: ClothingNeckGoldmedal
