- type: antag
  id: Survivor
  name: roles-antag-survivor-name
  antagonist: true
  objective: roles-antag-survivor-objective
  # guides: [  ]

- type: antag
  id: Wizard
  name: roles-antag-wizard-name
  antagonist: true
  # setPreference: true # Disabled as roundstart gamemode until reworked
  objective: roles-antag-wizard-objective # TODO: maybe give random objs and stationary ones from AntagObjectives and AntagRandomObjectives
  guides: [ Wizard ]
  tags:
  - OffStation
  # - Roundstart - Not currently available roundstart
  - Midround
  requirements: # I hate time locked roles but this should be enough time for someone to be acclimated
  - !type:OverallPlaytimeRequirement
    time: 5h

- type: antagSpecifier
  parent: RestrictedAntag
  id: Wizard
  spawnerPrototype: SpawnPointGhostWizard
  startingGear: WizardBlueGear
  roleLoadout:
  - RoleSurvivalExtendedAntag
  briefing:
    # SIS-ChatGreeting Start
    theme:
      titleBackground: "#241433"
      titleBorder: "#a855f7"
      messageBackground: "#12081c"
      messageBorder: "#4c1d95"
      messageText: "#f3e8ff"
      titleHighlight1: "#ffd700"
      titleHighlight2: "#c084fc"
      messageHighlight1: "#ffd700"
      messageHighlight2: "#c084fc"
    # SIS-ChatGreeting End
  # TODO: WizardComp as needed
  components:
  - type: NpcFactionMember
    factions:
    - Wizard
  - type: RandomMetadata
    nameSegments:
    - NamesWizardFirst
    - NamesWizardLast
    nameFormat: name-format-wizard
  mindRoles:
  - MindRoleWizard

# See wizard_startinggear for wiz start gear options
