- type: antag
  id: Heretic
  name: roles-antag-heretic-name
  antagonist: true
  setPreference: true
  objective: roles-antag-heretic-description
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 5h
  - !type:SpeciesRequirement
    inverted: true
    species:
    - Decapoid # You need 2 hands to draw the rune...
  guides: [ Heretics ]
  creditImage: /Textures/_Trauma/EndCredits/Antags/heretic.png

- type: antag
  id: Ghoul
  name: roles-antag-ghoul-name
  antagonist: true
  setPreference: false
  objective: roles-antag-ghoul-description
  guides: [ Heretics ]
  dontShowInCredits: True

- type: antag
  id: ArenaParticipant
  name: roles-antag-arena-participant-name
  antagonist: true
  setPreference: false
  objective: roles-antag-arena-participant-description
  guides: [ Heretics ]
  dontShowInCredits: True

- type: startingGear
  id: HereticMidround
  storage:
    back:
    - InkOfImaginination # TODO: just give the knowledge directly holy shit

- type: antagSpecifier
  parent: RestrictedAntag
  id: Heretic
  prefRoles: [ Heretic ]
  jobBlacklist: [ Chaplain ]
  # SIS-ChatGreeting-Start
  briefing:
    theme:
      titleBackground: "#1a0e24"
      titleBorder: "#9b59b6"
      messageBackground: "#0d0614"
      messageBorder: "#2e1140"
      titleText: "#ffffff"
      messageText: "#d6c8e0"
      highlight1: "#00ff9f"
      highlight2: "#c084fc"
  # SIS-ChatGreeting-End

- type: antagSpecifier
  parent: Heretic
  id: HereticMidround
  startingGear: HereticMidround

- type: antagSmite
  id: Heretic
  antag: Heretic
  rule: HereticRoundstart
  ruleComp: HereticRule
  icon:
    sprite: _Goobstation/Heretic/Blades/eldritch_blade.rsi
    state: icon
