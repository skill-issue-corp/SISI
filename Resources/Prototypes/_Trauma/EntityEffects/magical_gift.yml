- type: entityEffect
  id: MagicalGift
  conditions:
  - !type:WhitelistCondition
    whitelist:
      components:
      - KnowledgeHolder
    blacklist:
      components:
      - BorgChassis
      - Silicon # lol
  effects:
  - !type:GrantSkills
    skills:
      MagicalLiteracyKnowledge: 90 # need to already have a point in it to become master
  - !type:ChatMessage
    channel: Server
    message: "Что-то глубоко в вашей душе только что пробудилось... Вас озаряет прозрение о магии!" # RU-Localization
    color: "#8d12a6"

# All crew have a random chance of being magically gifted, regardless of role
- type: playerEffects
  id: MagicalGift
  effects:
  - !type:NestedEffect
    proto: MagicalGift
    probability: 0.1
