- type: entity
  parent: BaseMidroundAntagRule
  id: WerewolfMidround
  components:
  - type: StationEvent
    weight: 4
    earliestStart: 30
    minimumPlayers: 20
    duration: null
  - type: WerewolfRule
  - type: AntagSelection
    antags:
    - !type:LinearAntagCount
      proto: Werewolf
      range:
        min: 2
        max: 5
      playerRatio: 12
  - type: AntagPlayerEffects
    effects:
    - !type:NestedEffect
      proto: WerewolfSkills
  - type: AntagObjectives
    objectives:
    - EscapeWerewolfShuttleObjective
