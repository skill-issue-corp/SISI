- type: entity
  parent: BaseStationEventShortDelay
  id: RedPsiMonkeySpawn
  components:
  - type: GhostroleAlert
  - type: StationEvent
    startAnnouncement: station-event-vent-creatures-start-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    earliestStart: 20
    minimumPlayers: 10
    weight: 5
    duration: 60
  - type: VentHordeRule
    table:
      id: MobFirePsiMonkey
      amount: 1, 1

