- type: entity
  parent: BaseUnknownShuttleRule
  id: SpawnDeathsquad
  components:
  - type: StationEvent
    startAnnouncement: station-event-deathsquad-enroute
    startAudio:
      path: /Audio/Misc/notice2.ogg
    duration: 1
    maxOccurrences: 1
  - type: LoadMapRule
    gridPath: /Maps/_SIS/Shuttles/ERT-Small-Deathsquad.yml

