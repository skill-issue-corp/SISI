# Deathsquad

- type: entity
  parent: BaseUnknownShuttleRule
  id: SpawnDeathsquad
  components:
  - type: StationEvent
    startAnnouncement: station-event-deathsquad-enroute
    startAudio:
      path: /Audio/_Goobstation/StationEvents/rescue_imminent.ogg
    reoccurrenceDelay: 30
    duration: null
    maxOccurrences: 1
  - type: LoadMapRule
    gridPath: /Maps/_SIS/Shuttles/AdminSpawn/ERT-Small-Deathsquad.yml

# HECU

- type: entity
  parent: BaseUnknownShuttleRule
  id: SpawnHECU
  components:
  - type: LoadMapRule
    gridPath: /Maps/_SIS/Shuttles/AdminSpawn/ERT-HECU.yml

# CBURN

- type: entity
  parent: BaseGameRule
  id: SpawnCBURNNoAnnounce
  components:
  - type: LoadMapRule
    gridPath: /Maps/_SIS/Shuttles/AdminSpawn/ERT-Small-CBURN.yml

- type: entity
  parent: SpawnCBURNNoAnnounce
  id: SpawnCBURN
  components:
  - type: StationEvent
    startAnnouncement: station-event-cburn-enroute
    startAudio:
      path: /Audio/_SIS/Announcements/attention.ogg
    duration: 1
    maxOccurrences: 1

# ERT

- type: entity
  parent: BaseUnknownShuttleRule
  id: SpawnERTSecurity
  components:
  - type: StationEvent
    startAnnouncement: station-event-emergencyresponseteam-security-enroute
    startAudio:
      path: /Audio/_SIS/Announcements/attention.ogg
    duration: 1
    maxOccurrences: 1
  - type: LoadMapRule
    gridPath: /Maps/_SIS/Shuttles/AdminSpawn/ERT-Small-Sec.yml

- type: entity
  parent: SpawnERTSecurity
  id: SpawnERTSecurityDelayed
  components:
  - type: StationEvent
    # Can't make announcement delayed
    startAnnouncement: null
    startAudio: null
  - type: GameRule
    delay:
      min: 15
      max: 20
  - type: RoundEndRule
  - type: AlertLevelInterceptionRule
    alertLevel: Gamma
    overrideAlert: true
    locked: true

