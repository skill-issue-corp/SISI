    state: skull_icon
  - type: MindContainer
  - type: Input
    context: "human"
  - type: InputMover
  - type: Examiner
  - type: BlockMovement
  - type: Speech
    speechSounds: Pai
  - type: TypingIndicator
    proto: robot
  - type: Tag
    tags:
    - MindTransferTarget

- type: entity
  parent: [ OrganBaseArmLeft, OrganTerminatorExternal ]
  id: OrganTerminatorArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganTerminatorExternal ]
  id: OrganTerminatorArmRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganTerminatorExternal ]
