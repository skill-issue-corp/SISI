# doesnt spawn anything by itself, the terminator ghost role uses this rule for its objectives
# see TerminatorSpawn event and the SpawnPointGhostTerminator ghost role
- type: entity
  noSpawn: true
  parent: BaseGameRule
  id: Exterminator
  components:
  - type: GenericAntagRule
    agentName: terminator-round-end-agent-name
    objectives:
    - TerminateObjective
    - ShutDownObjective
