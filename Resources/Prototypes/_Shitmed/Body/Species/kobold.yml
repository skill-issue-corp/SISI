- type: entity
  parent: [ OrganBaseHandLeftDecorative, OrganKoboldExternal ] # SIS
  id: OrganKoboldHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganKoboldExternal ]
  id: OrganKoboldHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganKoboldExternal ]
  id: OrganKoboldLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganKoboldExternal ]
  id: OrganKoboldLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganKoboldExternal ]
  id: OrganKoboldFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganKoboldExternal ]
  id: OrganKoboldFootRight
