## Mob

- type: markingsGroup
  parent: Undergarments
  id: Kobold
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ LizardTailSmooth ]
    enum.HumanoidVisualLayers.Chest:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: true
      default: [ LizardSnoutRound ]
    enum.HumanoidVisualLayers.HeadTop:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceKobold
  name: kobold appearance
  components:
  - type: Inventory
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Trauma/Mobs/Animals/displacements.rsi
            state: jumpsuit-kobold
  - type: InitialBody
    organs:
      Torso: OrganKoboldTorso
      Head: OrganKoboldHead
      Tail: OrganKoboldTail
      ArmLeft: OrganKoboldArmLeft
      ArmRight: OrganKoboldArmRight
#      HandRight: OrganKoboldHandRight inkymed
#      HandLeft: OrganKoboldHandLeft inkymed
      LegLeft: OrganKoboldLegLeft
      LegRight: OrganKoboldLegRight
#      FootLeft: OrganKoboldFootLeft inkymed
#      FootRight: OrganKoboldFootRight inkymed
      Brain: OrganReptilianBrain
      Eyes: OrganReptilianEyes
      Tongue: OrganReptilianTongue
      Ears: OrganReptilianEars
      Lungs: OrganAnimalLungs
      Heart: OrganAnimalHeart
      Stomach: OrganAnimalStomach
      Liver: OrganAnimalLiver
      Kidneys: OrganAnimalKidneys
  - type: HumanoidProfile
    species: Kobold

## Base

- type: entity
  abstract: true
  parent: OrganBaseFleshy
  id: OrganKobold
  suffix: kobold

- type: entity
  abstract: true
  parent: OrganKobold
  id: OrganKoboldExternal
  components:
  - type: Sprite
    sprite: _SIS/Mobs/Species/Kobold/parts.rsi
  - type: VisualOrgan
    data:
      sprite: Mobs/Animals/kobold.rsi
    secondData: # inkymed
      sprite: _SIS/Mobs/Species/Kobold/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Kobold

## Parts

- type: entity
  parent: [ OrganBaseTorsoTailed, OrganKoboldExternal ]
  id: OrganKoboldTorso
  components:
  - type: VisualOrganMarkings
    markingData:
      group: None # no undergarments, i cbf to make a kobold specific one
    hideableLayers:
    - enum.HumanoidVisualLayers.Tail

- type: entity
  parent: [ OrganBaseHeadBald, OrganKoboldExternal ]
  id: OrganKoboldHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.HeadSide

- type: entity
  parent: [ OrganBaseTail, OrganKoboldExternal ]
  id: OrganKoboldTail

- type: entity
